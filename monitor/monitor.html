<script type="text/javascript">
  RED.nodes.registerType("smartcharge-monitor", {
    category: "function",
    color: "#a6bbcf",
    defaults: {
      name: { value: "" },
      cutoff: {
        value: 85,
        validate: function (v) {
          const n = Number(v);
          const rawPeak = $("#node-input-peakCharge").length
            ? $("#node-input-peakCharge").val()
            : this.peakCharge;
          const p = Number(rawPeak !== undefined && rawPeak !== "" ? rawPeak : 80);
          return Number.isFinite(n) && Number.isFinite(p) && n > p && n <= 100;
        },
      },
      chargerEfficiency: {
        value: 0.72,
        validate: function (v) {
          const n = Number(v);
          return Number.isFinite(n) && n > 0 && n <= 1;
        },
      },
      peakCharge: {
        value: 80,
        validate: function (v) {
          const n = Number(v);
          const rawCutoff = $("#node-input-cutoff").length
            ? $("#node-input-cutoff").val()
            : this.cutoff;
          const c = Number(rawCutoff !== undefined && rawCutoff !== "" ? rawCutoff : 85);
          return Number.isFinite(n) && n >= 0 && n < 100 && (!Number.isFinite(c) || n < c);
        },
      },
      pwrStdev: {
        value: 0.15,
        validate: function (v) {
          const n = Number(v);
          return Number.isFinite(n) && n > 0;
        },
      },
    },
    inputs: 1,
    outputs: 3,
    outputLabels: [
      "Charge power, in Watt",
      "Charge power rate of change, in Watt per hour",
      "OFF trigger",
    ],
    icon: "function.svg",
    label: function () {
      return this.name || "smartcharge-monitor";
    },
    oneditprepare: function () {
      $("#btn-smartcharge-toggle-advanced-settings").on("click", function () {
        $("#smartcharge-advanced-settings").toggle();
        if ($("#smartcharge-advanced-settings").is(":visible")) {
          $(this).text("Hide Advanced Settings");
        } else {
          $(this).text("Show Advanced Settings");
        }
      });
    },
  });
</script>

<script type="text/html" data-template-name="smartcharge-monitor">
  <div class="form-row">
    <label for="node-input-cutoff">Target charge (82% - 90%)</label>
    <input type="text" id="node-input-cutoff" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <button
      type="button"
      id="btn-smartcharge-toggle-advanced-settings"
      class="red-ui-button red-ui-button-small editor-button editor-button-small"
    >
      Show Advanced Settings
    </button>
  </div>
  <!-- Advanced settings section -->
  <div id="smartcharge-advanced-settings" style="display: none;">
    <div class="form-row">
      <label for="node-input-chargerEfficiency">Charger Efficiency</label>
      <input type="text" id="node-input-chargerEfficiency" />
    </div>
    <div class="form-row">
      <label for="node-input-peakCharge">Peak Charge</label>
      <input type="text" id="node-input-peakCharge" />
    </div>
    <div class="form-row">
      <label for="node-input-pwrStdev">Power Uncertainty (W)</label>
      <input type="text" id="node-input-pwrStdev" />
    </div>
    <div class="form-row">
      Default <code>0.15 W</code> suits <code>2–100 W</code> smart plugs; increase for high-wattage loads with coarse reporting jitter.
      For peak charge details see
      <a
        href="https://batteryuniversity.com/article/bu-409-charging-lithium-ion"
        target="_blank"
        >Battery University Article</a
      >
    </div>
  </div>
</script>

<script type="text/html" data-help-name="smartcharge-monitor">
  <p>
    Node-RED custom node for monitoring and optimizing battery charging. Charge
    your bike and power bank up to 85%.
  </p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">number</span></dt>
    <dd>The power from the battery charger.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>
      Charge power
      <dl class="message-properties">
        <dt>payload <span class="property-type">number</span></dt>
        <dd>The current power being used to charge the battery, in Watts.</dd>
      </dl>
    </li>
    <li>
      Charge power rate of change
      <dl class="message-properties">
        <dt>payload <span class="property-type">number</span></dt>
        <dd>The rate of change of the charging power, in Watts per hour (W/h).</dd>
      </dl>
    </li>
    <li>
      OFF trigger
      <dl class="message-properties">
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd>
          Message sent when charging should be turned off. Always <code>false</code>.
        </dd>
      </dl>
    </li>
  </ol>

  <h3>Details</h3>
  <p>
    The <code>smartcharge-monitor</code> node uses a 2-mode Interacting Multiple
    Model (IMM) Kalman filter to estimate charging power and exponential decay
    rate across changing load phases. Once statistically significant decay is
    confirmed and power drops below the target threshold, it emits a single-shot
    OFF trigger.
  </p>

  <h3>References</h3>
  <p>
    For more information on charging cycles, refer to
    <a
      href="https://batteryuniversity.com/article/bu-409-charging-lithium-ion"
      target="_blank"
      >Battery University</a
    >.
  </p>
</script>
